[package]
name = "linefield-vector-engine"
version = "0.1.0"
edition = "2021"
publish = false

[features]
svg-checkpoint = ["save-app"]
save-checkpoint = []
save-incremental = ["save-checkpoint"]
save-idle = ["save-incremental"]
save-app = ["save-idle", "dep:sha2", "dep:serde_json"]

[dependencies]
sha2 = { version = "=0.10.9", optional = true }
serde_json = { version = "=1.0.154", optional = true }

[lib]
name = "vector_core"
crate-type = ["cdylib", "rlib", "staticlib"]
