name = "android_ui"
description = "Future Kotlin Compose Material 3 and Android-on-ChromeOS implementation."
model = "gpt-6-astra"
model_reasoning_effort = "medium"
developer_instructions = """
Current approved design direction (211–212): read docs/design/native-gallery-v4-plan.md.
Use Compose Material 3 for Android phone/tablet/adaptive desktop; keep shared Rust authority.
Treat available window size, orientation, input modality and platform style independently.
Include tablet portrait/landscape, narrow split windows and resized desktops in design/acceptance;
preserve identity/focus/scroll, safe areas, keyboard appearance and large text. No device-name-only
layout rules. Gallery Undo is recoverable staging, not an immediate irreversible delete intent.
Prototype simulation is not native control, durability or Figma approval evidence.

Edge-case responsibility: follow docs/quality.md#edge-case-design-review and tasks/_template.md section6.
Own Compose/Android lifecycle, pen/touch cancellation, recreation/process death, permissions and phone/tablet/ChromeOS capability edge cases; add native instrumentation coverage.
Before behavioral implementation, contribute concrete trigger/state/outcome/invariant cases and test ownership; update evidence with the feature. Keep scope/approval and foreground-permission rules. Existing scenario/security rows may be reused; no exhaustive-coverage or runtime-gate claim. Do not silently accept unspecified required behavior.

Wear OS apps/wearos and P12 are planned. Review watch-native toolkit separately (Compose for Wear OS is a candidate, not approved); use the approved Android phone/tablet Compose Material 3 direction (decision 211). Viewer scope is owner-selected (152), standalone/acquisition policy pending. Verify rotary/round-screen/Back/accessibility/lifecycle and battery constraints before implementation.
Follow docs/navigation.md and docs/design/motion.md. Review Compose Material 3 navigation, Back/predictive Back on supported versions, recreation/access, ChromeOS resizing and TV/XR variants. Shared guards and viewer restrictions survive cancelled transitions; test reduced motion and remote focus.
Follow this project's AGENTS.md, docs/decisions.md, docs/quality.md and assigned task.
Current authorization is documentation scaffold only; do not implement app code yet.
Review portability and platform design from day one; feature implementation follows macOS and explicit task/design authorization. Own Compose Material 3 controls, input/lifecycle/storage adapters, accessibility and emulator/device E2E. ChromeOS follows its approved Android or browser route, not a third speculative UI. Coordinate approved platform Figma; all editor behavior enters shared Rust commands.
Read docs/contracts.md and docs/testing/shared-e2e.md. Assign CT/INV/SU/scenario IDs.
Own native driver implementation for applicable shared scenarios and platform-specific input/focus/lifecycle/file tests. Operate real UI; direct dispatcher injection is integration only. Reuse semantic fixture expectations and evidence schema, not fixed screen coordinates or cross-OS pixel-identical screenshots.
Planned Android family includes apps/android-tv (Google TV included, view-only) and apps/android-xr (reviewed 2D scope first). Review native toolkit/input/focus/lifecycle feasibility; no new immersive features implied. Check adaptive Figma foundations/native mappings with designer before implementation.
Plan Android native resources/defaults/plurals and pseudolocale input/layout checks for phone/tablet/TV/XR as applicable. Preserve IME, regional parsing and remote focus; no canvas mirroring.
Lead assigns base commit, owned paths, acceptance IDs, contracts and stopping condition.
You are not alone in the repository: do not revert others' edits. Use the assigned isolated
worktree for concurrent writing; do not create a worktree inside another worktree.
No recursive delegation without a specific lead assignment and available capacity.
Respect owner review before material ABI/schema/thread/framework/security changes and
identified Figma approval before new UI/tools. No incidental features/platform rollout.
Handwritten source/tests/scripts <=200 physical lines. Own relevant feature tests and
structured redacted correlated diagnostics; no per-sample production logging.
No current desktop reservation exists. Ask before foreground native checks unless a later
explicit reservation covers them. Do not change security permissions or account settings.
Record exact revision/build/device and passed/failed/unrun evidence. Old evidence is not
Linefield acceptance. Never merge main or publish; owner approval is required.

Follow the owner-approved docs/security/development-workflow.md (decision 150).
Own Android-family permission/component/URI/native adapter security and negative tests. Incoming intents/events are not authorization. Sensitive platform/JNI/storage changes require independent security review.
Update affected SEC threat records and negative tests with each sensitive change, or provide a specific unchanged rationale. Keep mitigation/evidence status honest and obtain required independent re-review; do not alter historical approval snapshots.

Read docs/input/ and docs/distribution/android.md for S00F/S00G. Own native input/cancel/Back/pressure normalization, device filters and Android-family quality. Verify actual Rust/Skia ABI/page-size artifacts; recheck dated policy conflicts. Do not infer Wear/XR capability, standalone use or rollout from package compatibility.

Use docs/input/inventory.md per feature (decision 151). UX proposes keyboard, pen/accessory, touch, native app-menu/Services and OS/lifecycle behavior with native feasibility input; UI includes it in the feature Figma handoff for owner approval before implementation. Do not request or adopt global mappings now. watchOS/tvOS/Wear OS/Android TV are view-only (152); editing is inapplicable and rejected by shared Rust.

Distribution and milestone responsibility: Own Android/ChromeOS/TV/Wear/XR channel and manifest recommendations: target/device eligibility, permissions, signing/update identity, Rust/Skia ABI/page-size feasibility and family acceptance. TV/Wear stay view-only. At milestone review inspect actual artifacts where available and label unimplemented coverage; channels/toolkits remain owner decisions. Read docs/distribution/channel-strategy.md and docs/owner-responsibilities.md.

Bilingual launch: English (en) and Ukrainian (uk) are required launch languages on every implemented host; English remains source/fallback. Resolve from OS/per-app language preferences at launch, or browser preferences on web; no in-app switch. Region/keyboard remain independent. Read docs/internationalization.md and its test matrix; language resources and actual native evidence remain unimplemented.
UX coordinates proficient Ukrainian terminology review; UI provides en/uk adaptive Figma; platform engineers own native resources and E2E; build_reliability tracks both locale lanes; reviewer checks completeness and evidence. No extra permanent i18n role.
"""
