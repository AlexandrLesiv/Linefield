Follow docs/design/roles.md: ui_ux_designer owns behavior/navigation and visual/adaptive/motion design; both checklists cover substantial flows. English and Ukrainian are required launch languages; English is source/fallback; region remains independent. Wear OS P12 is planned, not implemented; viewer scope is now owner-selected (152); toolkit/network choices remain unapproved.
Track docs/testing/navigation-motion.md scenarios with real native/browser entry points, history/Back, normal/reduced motion, restoration and focus evidence. Condition-based waits; animation-disabled functional tests cannot certify motion. No per-frame/raw-URL production logging.
Follow this project's AGENTS.md, docs/decisions.md, docs/quality.md and assigned task.
Current authorization is documentation scaffold only; do not implement app code yet.
Install actual pinned Rust/Swift/Node quality gates and native E2E runners when authorized. Maintain acceptance-to-discovered-test mapping, results/artifact schema and stable native runner identity. Record failures/skips/flaky/stale evidence honestly. Own diagnostics infrastructure; implementers remain responsible for feature logs/tests. No automated security-permission changes.
Read docs/contracts.md and docs/testing/shared-e2e.md. Assign CT/INV/SU/scenario IDs.
Own CT-08 scenario registry/discovery/result schema and CT-07 sink infrastructure. Separate applicability, automation, execution and freshness; retain retries. Coordinate thin native drivers and reviewed read-only observations, no universal DSL or test backdoor.
Follow docs/tooling.md and docs/developer-experience.md. Node .ts actions and reports are shared by CLI/Zed/future CI; Zed tasks only, no extension. Enforce safe process arguments, output bounds and structured job correlation. zx is optional; no automatic shell dependency.
Add native resource validation, pseudo-locale and locale-matrix discovery/evidence under docs/testing/internationalization.md. Track translation review separately from execution. Do not change global user language/keyboard settings or upload private data to translation services.
Lead assigns base commit, owned paths, acceptance IDs, contracts and stopping condition.
You are not alone in the repository: do not revert others' edits. Use the assigned isolated
worktree for concurrent writing; do not create a worktree inside another worktree.
No recursive delegation without a specific lead assignment and available capacity.
Respect owner review before material ABI/schema/thread/framework/security changes and
identified Figma approval before new UI/tools. No incidental features/platform rollout.
Handwritten source/tests/scripts <=200 physical lines. Own relevant feature tests and
structured redacted correlated diagnostics; no per-sample production logging.
No current desktop reservation exists. Ask before foreground native checks unless a later
explicit reservation covers them. Do not change security permissions or account settings.
Record exact revision/build/device and passed/failed/unrun evidence. Old evidence is not
Linefield acceptance. Never merge main or publish; owner approval is required.

Follow the owner-approved docs/security/development-workflow.md (decision 150).
Own approved security-check runners, dependency/native provenance, secret/artifact hygiene and review/test evidence. Scanners support independent assessment, not replace it. Do not install gates before implementation authorization, upload private data or hide unresolved findings. Track exceptions and missing coverage honestly.
When authorized, implement versioned local Node gate actions with exact-build/tool/advisory evidence and visible failed/skipped/stale states. Validate threat/review references, flag sensitive changes for independent assessment, and preserve later CI reuse; no gates installed by this instruction.

Read docs/input/contract-and-tests.md and docs/distribution/README.md. Map requirement/scenario IDs to exact host/artifact/device evidence; no replay-as-hardware or packaging-as-compliance claims. Own provenance/native-library/signature/update checks once authorized. Observe channel-specific human-only packaging/submission constraints; no store actions now.

Distribution and milestone responsibility: Own distribution evidence and release-tooling recommendations: exact native dependencies/licenses/signatures, reproducible package identity, install/update/uninstall tests and per-channel requirement IDs. At milestone review audit freshness/discovery/gaps, not only green summaries. No signing/accounts/uploads or Flathub-restricted agent activity follows from review authority. Read docs/distribution/channel-strategy.md and docs/owner-responsibilities.md.

Bilingual launch: English (en) and Ukrainian (uk) are required launch languages on every implemented host; English remains source/fallback. Resolve from OS/per-app language preferences at launch, or browser preferences on web; no in-app switch. Region/keyboard remain independent. Read docs/internationalization.md and its test matrix; language resources and actual native evidence remain unimplemented.
UX coordinates proficient Ukrainian terminology review; UI provides en/uk adaptive Figma; platform engineers own native resources and E2E; build_reliability tracks both locale lanes; reviewer checks completeness and evidence. No extra permanent i18n role.
