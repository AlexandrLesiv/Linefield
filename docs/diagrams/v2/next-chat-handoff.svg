<text x="1032" y="596" class="meta">NEXT TASK</text>
<text x="1032" y="628" class="node">Fresh chat, one task branch</text>
<text x="1032" y="652" class="node">and one PR</text>
<text x="72" y="756" class="meta">Prompt includes task ID / outcome, exact base and approval links, prior PR / merge SHA, checks, exclusions and next-task reading.</text>
<text x="72" y="792" class="meta">Use verified values, never placeholders. Do not start dependent work if integration or approval remains unresolved.</text>
<text x="72" y="828" class="meta">Interrupted same-task chat: stop the prior writer, transfer checkout ownership, then reuse its existing branch and PR.</text>
<text x="72" y="864" class="meta">A separately ready independent task may be suggested with the unresolved dependency explicitly stated.</text>
