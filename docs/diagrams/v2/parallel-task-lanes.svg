<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="title description">
<title id="title">Independent tasks keep moving</title>
<desc id="description">Independent tasks can proceed while another PR awaits owner review. Shared contracts and file conflicts serialize affected work; stacked PRs retain explicit merge order.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#718096" stroke-width="1.5"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#233148}.title{font-size:40px;font-weight:600;letter-spacing:-.7px}.section{font-size:26px;font-weight:600}.node{font-size:20px;font-weight:600}.body{font-size:16px}.meta{font-size:14px;fill:#59677C}.edge{fill:none;stroke:#718096;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.guide{fill:none;stroke:#718096;stroke-width:1.5;stroke-dasharray:4 8}</style></defs>
<rect width="1440" height="1140" fill="#F7F8FA"/>
<text x="72" y="64" class="meta">LINEFIELD / DIAGRAM LANGUAGE v2</text>
<text x="900" y="64" class="meta">WORKFLOW · OWNER REVIEW / MERGE</text>
<text x="72" y="123" class="title">Independent tasks keep moving</text>
<text x="72" y="166" class="body">Each task keeps one branch, one worktree and one PR. Owner review can overlap independent work.</text>
<rect x="72" y="260" width="256" height="514" rx="16" fill="#F7F7FE" stroke="#718096" stroke-width="1.5"/>
<text x="96" y="300" class="meta">STARTING POINT</text>
<text x="96" y="340" class="node">Reviewed base</text>
<text x="96" y="380" class="body">Explicit dependencies</text>
<text x="96" y="412" class="body">Disjoint owned paths</text>
<text x="96" y="444" class="body">Frozen shared contracts</text>
<text x="96" y="704" class="meta">One writer per task</text>
<text x="96" y="740" class="meta">No automatic merge</text>
<path d="M328 330H400" class="edge"/>
<rect x="400" y="260" width="424" height="134" rx="16" fill="#F3FAF7" stroke="#718096" stroke-width="1.5"/>
<text x="424" y="295" class="node">Task A</text>
<text x="424" y="328" class="body">Own branch + isolated worktree</text>
<text x="424" y="364" class="meta">Checks + specialist + independent review</text>
<path d="M824 330H920" class="edge"/>
<rect x="920" y="260" width="448" height="134" rx="16" fill="#F3FAF7" stroke="#718096" stroke-width="1.5"/>
<text x="944" y="295" class="node">PR A</text>
<text x="944" y="330" class="body">PR ready · owner reviewing</text>
<text x="944" y="364" class="meta">Owner merges; harness verifies integration</text>
<path d="M328 520H400" class="edge"/>
<rect x="400" y="450" width="424" height="134" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
<text x="424" y="485" class="node">Task B</text>
<text x="424" y="518" class="body">Own branch + isolated worktree</text>
<text x="424" y="554" class="meta">Design → implement → test → review</text>
<path d="M824 520H920" class="edge"/>
<rect x="920" y="450" width="448" height="134" rx="16" fill="#FFFFFF" stroke="#718096" stroke-width="1.5"/>
<text x="944" y="485" class="node">PR B</text>
<text x="944" y="520" class="body">Work continues independently</text>
<text x="944" y="554" class="meta">Owner merges; harness verifies integration</text>
<path d="M328 710H400" class="edge"/>
<rect x="400" y="640" width="424" height="134" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
<text x="424" y="675" class="node">Task C</text>
<text x="424" y="708" class="body">Own branch + isolated worktree</text>
<text x="424" y="744" class="meta">Design → implement → test → review</text>
<path d="M824 710H920" class="edge"/>
<rect x="920" y="640" width="448" height="134" rx="16" fill="#FFFFFF" stroke="#718096" stroke-width="1.5"/>
<text x="944" y="675" class="node">PR C</text>
<text x="944" y="710" class="body">Work continues independently</text>
<text x="944" y="744" class="meta">Owner merges; harness verifies integration</text>
<rect x="72" y="834" width="624" height="192" rx="16" fill="#FFFAEF" stroke="#718096" stroke-width="1.5"/>
<text x="96" y="870" class="meta">CONFLICT OR UNSETTLED CONTRACT</text>
<text x="96" y="910" class="node">Serialize the affected work</text>
<text x="96" y="948" class="body">Shared mutable files or changing interfaces need one owner.</text>
<text x="96" y="980" class="body">Keep unrelated ready tasks moving; do not guess a contract.</text>
<rect x="728" y="834" width="640" height="192" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
<text x="752" y="870" class="meta">DEPENDENT TASK FROM AN UNMERGED PR</text>
<text x="752" y="910" class="node">Label it stacked; merge the parent first</text>
<text x="752" y="948" class="body">Retarget onto the verified base, then rerun affected checks.</text>
<text x="752" y="980" class="body">Parallel work does not turn a dependency into approval.</text>
<path d="M72 1060H1368" stroke="#E1E6ED"/>
<text x="72" y="1096" class="meta">Review queue and implementation capacity are separate · One task / branch / PR</text>
</svg>
