<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1428" viewBox="0 0 1440 1428" role="img" aria-labelledby="title description">
<title id="title">Accepted is not yet saved</title>
<desc id="description">Decision181 · Command admission, persistence and acknowledgement remain distinct boundaries.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#718096" stroke-width="1.5"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#233148}.title{font-size:40px;font-weight:600;letter-spacing:-.7px}.section{font-size:26px;font-weight:600}.node{font-size:20px;font-weight:600}.body{font-size:16px}.meta{font-size:14px;fill:#59677C}.edge{fill:none;stroke:#718096;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.guide{fill:none;stroke:#718096;stroke-width:1.5;stroke-dasharray:4 8}</style></defs>
<rect width="1440" height="1428" fill="#F7F8FA"/>
<text x="72" y="64" class="meta">LINEFIELD / DIAGRAM LANGUAGE v2</text>
<text x="1368" y="64" class="meta" text-anchor="end">APPROVED DESIGN · NOT BUILT</text>
<text x="72" y="123" class="title">Accepted is not yet saved</text>
<text x="72" y="161" class="body">Decision181 · Command admission, persistence and acknowledgement remain distinct boundaries.</text>
<rect x="72" y="216" width="160" height="76" rx="12" fill="#FFFFFF" stroke="#718096" stroke-width="1.5"/>
<text x="152" y="246" class="body" text-anchor="middle">Client main thread</text>
<path d="M152 292V1336" class="guide"/>
<rect x="450.66666666666674" y="216" width="160" height="76" rx="12" fill="#FFFFFF" stroke="#718096" stroke-width="1.5"/>
<text x="530.6666666666667" y="246" class="body" text-anchor="middle">Coordinator main</text>
<text x="530.6666666666667" y="268" class="body" text-anchor="middle">thread</text>
<path d="M530.6666666666667 292V1336" class="guide"/>
<rect x="829.3333333333334" y="216" width="160" height="76" rx="12" fill="#FFFFFF" stroke="#718096" stroke-width="1.5"/>
<text x="909.3333333333334" y="246" class="body" text-anchor="middle">Storage owner</text>
<path d="M909.3333333333334 292V1336" class="guide"/>
<rect x="1208" y="216" width="160" height="76" rx="12" fill="#FFFFFF" stroke="#718096" stroke-width="1.5"/>
<text x="1288" y="246" class="body" text-anchor="middle">Drawing SQLite</text>
<path d="M1288 292V1336" class="guide"/>
<rect x="80" y="309" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="330" class="body">1 · Named command + session / sequence / operation + stroke token</text>
<path d="M152 363H530.6666666666667" class="edge"/>
<rect x="80" y="401" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="422" class="body">2 · Validate authority, dependencies, token and reserved capacity</text>
<path d="M530.6666666666667 455h40v22h-40" class="edge"/>
<rect x="80" y="493" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="514" class="body">3 · Reply: Accepted (not Saved); retain exact pending command</text>
<path d="M530.6666666666667 547H152" class="edge"/>
<rect x="80" y="585" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="606" class="body">4 · Immutable ordered changes + base / target versions + receipt</text>
<path d="M530.6666666666667 639H909.3333333333334" class="edge"/>
<rect x="80" y="677" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="698" class="body">5 · BEGIN IMMEDIATE; compare incarnation + durable base</text>
<path d="M909.3333333333334 731H1288" class="edge"/>
<rect x="80" y="769" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="790" class="body">6 · Changes + revision pair + command receipts</text>
<path d="M909.3333333333334 823H1288" class="edge"/>
<rect x="80" y="861" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="882" class="body">7 · Reply: synchronized COMMIT or failure / unknown</text>
<path d="M1288 915H909.3333333333334" class="edge"/>
<rect x="80" y="953" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="974" class="body">8 · Reply: identity-bound durable acknowledgement</text>
<path d="M909.3333333333334 1007H530.6666666666667" class="edge"/>
<rect x="80" y="1045" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="1066" class="body">9 · Reject stale completion; advance only captured durable revisions</text>
<path d="M530.6666666666667 1099h40v22h-40" class="edge"/>
<rect x="80" y="1137" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="1158" class="body">10 · Reply: durable outcome + current / durable version pair</text>
<path d="M530.6666666666667 1191H152" class="edge"/>
<rect x="80" y="1229" width="1280" height="28" fill="#F7F8FA"/>
<text x="96" y="1250" class="body">11 · Contiguous incorporated-outcome acknowledgement</text>
<path d="M152 1283H530.6666666666667" class="edge"/>
<path d="M72 1356H1368" stroke="#E1E6ED"/>
<text x="72" y="1388" class="meta">Solid arrows include replies · Dashed guides are participant lifetimes</text>
<text x="1368" y="1388" class="meta" text-anchor="end">2026-10-19 · Full-size SVG</text>
</svg>
