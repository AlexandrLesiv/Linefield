<text x="72" y="684" class="meta">1 · Idle → Drawing: accepted pen down. 2 · Drawing self-loop: validated actual or predicted samples (historical wording).</text>
<text x="72" y="720" class="meta">3 · Drawing → Idle: pen up / commit one undo. 4 · Drawing → Idle: Escape or focus loss / cancel.</text>
<text x="72" y="756" class="meta">5 · Idle → Transforming: begin selected-stroke move or scale. 6 · Transforming self-loop: transient preview.</text>
<text x="72" y="792" class="meta">7 · Transforming → Idle: release / commit one undo. 8 · Transforming → Idle: Escape or focus loss / cancel.</text>
<text x="72" y="828" class="meta">9 · Idle → Panning: navigation begins. 10 · Panning → Idle: navigation ends or cancels.</text>
<text x="72" y="864" class="meta">Initial marker in the original points to Idle. Numbers identify transitions; they do not prescribe event order.</text>
