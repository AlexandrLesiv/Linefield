<text x="648" y="364" class="node">Review + PR</text>
<path d="M968 366H992" class="edge"/>
<rect x="808" y="304" width="160" height="164" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
<text x="832" y="332" class="meta">05</text>
<text x="832" y="364" class="node">Owner</text>
<text x="832" y="388" class="node">review /</text>
<text x="832" y="412" class="node">merge</text>
<path d="M1152 366H1176" class="edge"/>
<rect x="992" y="304" width="160" height="164" rx="16" fill="#F3FAF7" stroke="#718096" stroke-width="1.5"/>
<text x="1016" y="332" class="meta">06</text>
<text x="1016" y="364" class="node">Verify</text>
<text x="1016" y="388" class="node">merge</text>
<rect x="1176" y="304" width="160" height="164" rx="16" fill="#F3FAF7" stroke="#718096" stroke-width="1.5"/>
<text x="1200" y="332" class="meta">07</text>
<text x="1200" y="364" class="node">Next prompt</text>
<path d="M888 468V500H1000V560H520V468" class="edge"/>
<rect x="544" y="526" width="376" height="25" rx="8" fill="#F7F8FA"/>
<text x="552" y="544" class="meta">comments → fix in the same task / branch / PR</text>
<path d="M472 468V608H336V664" class="edge"/>
<rect x="248" y="610" width="72" height="25" rx="8" fill="#F7F8FA"/>
<text x="256" y="628" class="meta">blocked</text>
<rect x="72" y="664" width="528" height="140" rx="16" fill="#FFFAEF" stroke="#718096" stroke-width="1.5"/>
<text x="96" y="692" class="meta">STOP DEPENDENT WORK</text>
<text x="96" y="724" class="node">Missing approval, dependency or required evidence</text>
<rect x="808" y="664" width="528" height="140" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
<text x="832" y="692" class="meta">REVIEW GATE</text>
<text x="832" y="724" class="node">Specialist + fresh review, exact checks, approved</text>
<text x="832" y="748" class="node">publication destination</text>
<text x="72" y="864" class="body">Publish one PR only within authorized repository access; drafts disclose unfinished evidence.</text>
<text x="72" y="904" class="body">No automatic merge. If verification is incomplete, remain integration-pending and retain the task checkpoint.</text>
<text x="72" y="944" class="body">Closed without merge means cancelled / superseded, not Done. New post-merge work gets a follow-up task.</text>
<path d="M72 1008H1368" stroke="#E1E6ED"/>
<text x="72" y="1040" class="meta">One executable task owns one branch / PR · Milestones do not get implementation branches</text>
<text x="1368" y="1040" class="meta" text-anchor="end">2026-10-19 · Full-size SVG</text>
</svg>
