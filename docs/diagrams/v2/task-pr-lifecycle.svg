<text x="96" y="364" class="node">Ready task</text>
<path d="M416 366H440" class="edge"/>
<rect x="256" y="304" width="160" height="164" rx="16" fill="#F7F7FE" stroke="#718096" stroke-width="1.5"/>
<text x="280" y="332" class="meta">02</text>
<text x="280" y="364" class="node">Branch +</text>
<text x="280" y="388" class="node">chat</text>
<path d="M600 366H624" class="edge"/>
<rect x="440" y="304" width="160" height="164" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
<text x="464" y="332" class="meta">03</text>
<text x="464" y="364" class="node">Scoped work</text>
<path d="M784 366H808" class="edge"/>
<rect x="624" y="304" width="160" height="164" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
