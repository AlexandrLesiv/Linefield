<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
<title id="title">One task, one branch, one PR</title>
<desc id="description">The owner reviews and merges. The harness verifies integration before handing off the next ready task.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#718096" stroke-width="1.5"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#233148}.title{font-size:40px;font-weight:600;letter-spacing:-.7px}.section{font-size:26px;font-weight:600}.node{font-size:20px;font-weight:600}.body{font-size:16px}.meta{font-size:14px;fill:#59677C}.edge{fill:none;stroke:#718096;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}.guide{fill:none;stroke:#718096;stroke-width:1.5;stroke-dasharray:4 8}</style></defs>
<rect width="1440" height="1080" fill="#F7F8FA"/>
<text x="72" y="64" class="meta">LINEFIELD / DIAGRAM LANGUAGE v2</text>
<text x="1368" y="64" class="meta" text-anchor="end">OWNER-APPROVED WORKFLOW · NOT AN AUTOMATION</text>
<text x="72" y="123" class="title">One task, one branch, one PR</text>
<text x="72" y="161" class="body">The owner reviews and merges. The harness verifies integration before handing off the next</text>
<text x="72" y="185" class="body">ready task.</text>
<path d="M232 366H256" class="edge"/>
<rect x="72" y="304" width="160" height="164" rx="16" fill="#F7F7FE" stroke="#718096" stroke-width="1.5"/>
