<text x="1032" y="564" class="node">Reloading</text>
<rect x="520" y="504" width="304" height="116" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
<text x="544" y="532" class="meta">RECOVERY</text>
<text x="544" y="564" class="node">Reconciling</text>
<rect x="72" y="504" width="304" height="116" rx="16" fill="#FFFAEF" stroke="#718096" stroke-width="1.5"/>
<text x="96" y="532" class="meta">NEEDS EXPLICIT RECOVERY</text>
<text x="96" y="564" class="node">RecoveryRequired</text>
<text x="72" y="668" class="meta">1 · Attached → Paused: connection / authority lost. 2 · Paused → Discovering: reconnect requested.</text>
<text x="72" y="704" class="meta">3 · Discovering → Paused: old lock still held or peer unavailable.</text>
<text x="72" y="740" class="meta">4 · Discovering → Reloading: exclusive takeover or verified new owner.</text>
<text x="72" y="776" class="meta">5 · Reloading → Reconciling: validated durable state + fresh owner generation.</text>
<text x="72" y="812" class="meta">6 · Reconciling → Attached: known outcomes applied, unknown work retained, fresh empty history.</text>
<text x="72" y="848" class="meta">7 · Reconciling → RecoveryRequired: invalid data or unavailable authority.</text>
<path d="M72 1056H1368" stroke="#E1E6ED"/>
<text x="72" y="1088" class="meta">Notation migration only · See source packet for authority and evidence</text>
