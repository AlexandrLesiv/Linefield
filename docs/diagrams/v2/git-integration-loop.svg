<text x="672" y="488" class="meta">next bounded task</text>
<text x="72" y="580" class="body">Internal review includes the relevant specialist and a fresh independent reviewer.</text>
<text x="72" y="620" class="body">Verify the exact integration candidate; owner approval precedes main integration.</text>
<text x="72" y="660" class="body">A later merge changes provenance: map the tested tree and rerun affected checks if integrated content differs.</text>
<path d="M72 752H1368" stroke="#E1E6ED"/>
<text x="72" y="784" class="meta">Approved process does not claim that a remote, PR or main integration already exists</text>
<text x="1368" y="784" class="meta" text-anchor="end">2026-10-19 · Full-size SVG</text>
