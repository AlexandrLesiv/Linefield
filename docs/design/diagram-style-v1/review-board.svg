<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1536" viewBox="0 0 1440 1536" role="img" aria-labelledby="title description">
  <title id="title">Linefield diagram style v1 — approval proposal</title>
  <desc id="description">Illustrative notation, not an implemented architecture. Three examples show ownership boundaries, an ordered sequence with uncertain outcome recovery, and runtime states. Evidence-status badges are separate from runtime state and decorative phase colors. Solid arrows carry messages, including async ones; dashed vertical lines mean participant lifetimes only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#718096" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="caution-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#785520" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#233148}
      .title{font-size:36px;font-weight:600;letter-spacing:-.8px}
      .section{font-size:24px;font-weight:600;letter-spacing:-.3px}
      .node-title{font-size:18px;font-weight:600}
      .body{font-size:16px}
      .meta{font-size:14px;fill:#59677C}
      .eyebrow{font-size:14px;font-weight:600;letter-spacing:1.5px;fill:#59677C}
      .badge{font-size:14px;font-weight:600}
      .edge{fill:none;stroke:#718096;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .caution-edge{fill:none;stroke:#785520;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#caution-arrow)}
      .guide{fill:none;stroke:#718096;stroke-width:1.5;stroke-dasharray:5 7}
      .card{fill:#FFFFFF;stroke:#718096;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="1536" fill="#F7F8FA"/>
  <rect x="48" y="40" width="1344" height="1456" rx="24" fill="#FFFFFF" stroke="#E1E6ED"/>
  <text x="88" y="102" class="eyebrow">LINEFIELD / DIAGRAM LANGUAGE</text>
  <rect x="1160" y="78" width="192" height="36" rx="18" fill="#F1F3F7"/>
  <path d="M1182 89l7 7-7 7-7-7Z" fill="none" stroke="#59677C" stroke-width="1.5"/>
  <text x="1202" y="101" class="badge" style="fill:#59677C">PROPOSED · v1</text>
  <text x="88" y="164" class="title">Clarity, with a consistent visual rhythm.</text>
  <text x="88" y="198" class="body" style="fill:#59677C">Native SVG · deliberate layout · honest status · one source per diagram</text>

  <!-- Ownership: grouping color is independent of evidence status. -->
  <rect x="88" y="232" width="1264" height="252" rx="16" fill="#F7F7FE"/>
  <text x="112" y="268" class="eyebrow" style="fill:#59547D">01 / OWNERSHIP</text>
  <text x="112" y="306" class="section">Show who owns the work.</text>
  <rect x="112" y="330" width="352" height="122" rx="12" class="card"/>
  <text x="136" y="360" class="meta">HOST VIEW · PRESENTATION OWNER</text>
  <text x="136" y="392" class="node-title">View and user intent</text>
  <text x="136" y="422" class="body">Disposable presentation state</text>
  <path d="M464 391H824" class="edge"/>
  <text x="644" y="367" class="body" text-anchor="middle">Copied request · async</text>
  <text x="644" y="424" class="meta" text-anchor="middle">Label the crossing and lifetime.</text>
  <rect x="824" y="330" width="504" height="122" rx="12" class="card"/>
  <text x="848" y="360" class="meta">COMMAND OWNER · EXECUTION BOUNDARY</text>
  <text x="848" y="392" class="node-title">One mutable authority</text>
  <text x="848" y="422" class="body">Validate intent before accepting change</text>

  <!-- Sequence: time moves down; solid arrows carry all messages. -->
  <rect x="88" y="516" width="1264" height="480" rx="16" fill="#F5F9FD"/>
  <text x="112" y="552" class="eyebrow" style="fill:#466B8E">02 / SEQUENCE &amp; RECOVERY</text>
  <text x="112" y="590" class="section">Separate an attempt from a confirmed outcome.</text>
  <rect x="112" y="614" width="280" height="52" rx="12" class="card"/>
  <rect x="504" y="614" width="280" height="52" rx="12" class="card"/>
  <rect x="1008" y="614" width="320" height="52" rx="12" class="card"/>
  <text x="252" y="647" class="node-title" text-anchor="middle">View</text>
  <text x="644" y="647" class="node-title" text-anchor="middle">Command owner</text>
  <text x="1168" y="647" class="node-title" text-anchor="middle">Durable store</text>
  <path d="M252 666V876M644 666V876M1168 666V824" class="guide"/>
  <path d="M252 710H644" class="edge"/>
  <text x="448" y="696" class="body" text-anchor="middle">1 · Request change · async</text>
  <path d="M644 758H1168" class="edge"/>
  <text x="906" y="742" class="body" text-anchor="middle">2 · Commit attempt · async</text>
  <path d="M1168 810H644" class="edge"/>
  <text x="906" y="795" class="body" text-anchor="middle">3 · Reply · confirmed only with proof</text>
  <path d="M644 862H252" class="edge"/>
  <text x="448" y="846" class="body" text-anchor="middle">4 · Confirmed reply · if proven</text>
  <path d="M1168 758H1344V908H1328" class="caution-edge"/>
  <rect x="1008" y="846" width="320" height="118" rx="12" fill="#FFFAEF" stroke="#785520" stroke-width="1.5"/>
  <text x="1032" y="876" class="badge" style="fill:#785520">IF OUTCOME IS UNKNOWN</text>
  <text x="1032" y="908" class="node-title" style="fill:#785520">Keep existing bytes.</text>
  <text x="1032" y="938" class="body" style="fill:#785520">Reconcile before retry.</text>
  <text x="112" y="926" class="meta">Time ↓ · Solid arrows = labeled messages</text>
  <text x="112" y="952" class="meta">Dashed guides = participant lifetime · Recovery is a conditional branch</text>

  <!-- Runtime states are not approval labels. -->
  <rect x="88" y="1028" width="1264" height="288" rx="16" fill="#F3FAF7"/>
  <text x="112" y="1064" class="eyebrow" style="fill:#386B57">03 / RUNTIME STATE</text>
  <rect x="568" y="1084" width="232" height="56" rx="12" class="card"/>
  <text x="684" y="1119" class="node-title" text-anchor="middle">Pending</text>
  <text x="832" y="1106" class="body">Runtime names describe behavior.</text>
  <text x="832" y="1132" class="meta">Evidence badges describe adoption and proof.</text>
  <path d="M684 1140V1172H332V1212" class="edge"/>
  <path d="M684 1140V1172H1100V1212" class="caution-edge"/>
  <rect x="248" y="1180" width="168" height="24" rx="12" fill="#F3FAF7"/>
  <text x="332" y="1197" class="meta" text-anchor="middle">Proof received</text>
  <rect x="984" y="1180" width="232" height="24" rx="12" fill="#F3FAF7"/>
  <text x="1100" y="1197" class="meta" text-anchor="middle" style="fill:#785520">Lost acknowledgement</text>
  <rect x="216" y="1212" width="232" height="56" rx="12" class="card"/>
  <text x="332" y="1247" class="node-title" text-anchor="middle">Confirmed</text>
  <rect x="984" y="1212" width="232" height="56" rx="12" fill="#FFFAEF" stroke="#785520" stroke-width="1.5"/>
  <text x="1100" y="1247" class="node-title" text-anchor="middle" style="fill:#785520">Unknown</text>

  <!-- Words and distinct symbols redundantly carry evidence status. -->
  <text x="88" y="1358" class="eyebrow">EVIDENCE STATUS · SEPARATE FROM STAGE COLORS AND RUNTIME STATE</text>
  <rect x="88" y="1376" width="170" height="38" rx="19" fill="#EEF7F1"/>
  <circle cx="110" cy="1395" r="5" fill="#386B57"/>
  <text x="126" y="1400" class="badge" style="fill:#386B57">CURRENT</text>
  <rect x="278" y="1376" width="268" height="38" rx="19" fill="#EFF4FA"/>
  <path d="M294 1395l5 5 10-11" fill="none" stroke="#466B8E" stroke-width="2"/>
  <text x="320" y="1400" class="badge" style="fill:#466B8E">APPROVED · NOT BUILT</text>
  <rect x="566" y="1376" width="190" height="38" rx="19" fill="#F1F3F7"/>
  <path d="M588 1388l7 7-7 7-7-7Z" fill="none" stroke="#59677C" stroke-width="1.5"/>
  <text x="608" y="1400" class="badge" style="fill:#59677C">PROPOSED</text>
  <rect x="776" y="1376" width="174" height="38" rx="19" fill="#FFF0ED"/>
  <rect x="792" y="1388" width="14" height="14" rx="2" fill="none" stroke="#9C3B32" stroke-width="1.5"/>
  <path d="M795 1391l8 8m0-8-8 8" stroke="#9C3B32" stroke-width="1.5"/>
  <text x="820" y="1400" class="badge" style="fill:#9C3B32">BLOCKED</text>
  <rect x="970" y="1376" width="204" height="38" rx="19" fill="#F1F3F7"/>
  <path d="M987 1395h14" stroke="#59677C" stroke-width="2"/>
  <text x="1015" y="1400" class="badge" style="fill:#59677C">HISTORICAL</text>
  <path d="M88 1440H1352" stroke="#E1E6ED"/>
  <text x="88" y="1469" class="meta">Style v1 · Illustrative notation; no architecture adoption or implementation claim</text>
  <text x="1352" y="1469" class="meta" text-anchor="end">2026-10-19 · Open SVG at full size</text>
</svg>
