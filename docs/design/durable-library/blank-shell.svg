<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Durable empty library v1 — blank host and failed Open</title>
  <desc id="desc">Selected left tools rail and top settings retained with clear saved-empty-drawing and non-editing-tools notices. Includes narrow Ukrainian and created-but-open-failed state.</desc>
