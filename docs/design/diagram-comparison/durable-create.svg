<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title description">
  <title id="title">Linefield — creating a durable drawing</title>
  <desc id="description">Proposed flow, not implemented storage. New drawing leads to reserving identity and name, writing an empty drawing, then reopening and verifying. Verified drawings are added to the library and opened. An uncertain outcome preserves existing bytes and requires reconciliation before retry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#718096" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A57832" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172A44" flood-opacity="0.045"/></filter>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .eyebrow{font-size:12px;font-weight:650;letter-spacing:2px}
      .heading{font-size:26px;font-weight:650;letter-spacing:-.6px;fill:#233148}
      .label{font-size:18px;font-weight:550;fill:#26364B;text-anchor:middle}
      .caption{font-size:14px;fill:#6B7889}
      .connector{fill:none;stroke:#718096;stroke-width:1.6;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1440" height="880" fill="#F7F8FA"/>
  <rect x="48" y="42" width="1344" height="796" rx="24" fill="#FFFFFF" stroke="#E7EBEF"/>
  <path d="M88 91h18m-18 7h12m-12 7h18" stroke="#5366A0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="119" y="103" class="eyebrow" fill="#5366A0">LINEFIELD / ARCHITECTURE</text>
  <rect x="1203" y="80" width="141" height="32" rx="16" fill="#F1F3F7"/>
  <circle cx="1220" cy="96" r="3.5" fill="#7C8799"/>
  <text x="1233" y="101" font-size="12" font-weight="600" fill="#59677C">PROPOSED FLOW</text>
  <text x="88" y="162" font-size="36" font-weight="650" letter-spacing="-1.1" fill="#1E2B40">Creating a durable drawing</text>
  <text x="89" y="193" font-size="16" fill="#6B7889">From a new drawing to a verified library entry.</text>

  <!-- Three equal stages, with one shared reading direction. -->
  <rect x="88" y="232" width="388" height="340" rx="18" fill="#F7F7FE" stroke="#E7E7F5"/>
  <rect x="526" y="232" width="388" height="340" rx="18" fill="#F5F9FD" stroke="#E0EAF4"/>
  <rect x="964" y="232" width="388" height="340" rx="18" fill="#F3FAF7" stroke="#DDEDE5"/>

  <text x="116" y="268" class="eyebrow" fill="#7973AB">01</text>
  <text x="116" y="304" class="heading">Create</text>
  <text x="554" y="268" class="eyebrow" fill="#5D85AA">02</text>
  <text x="554" y="304" class="heading">Preserve</text>
  <text x="992" y="268" class="eyebrow" fill="#548771">03</text>
  <text x="992" y="304" class="heading">Present</text>

  <!-- Orthogonal stage transitions are drawn behind the cards. -->
  <path d="M448 485H489Q501 485 501 473V389Q501 377 513 377H554" class="connector"/>
  <path d="M886 485H992" class="connector"/>
  <rect x="904" y="442" width="71" height="25" rx="12.5" fill="#FFFFFF" stroke="#E1EAE6"/>
  <text x="939.5" y="459" font-size="12" font-weight="600" text-anchor="middle" fill="#497963">Verified</text>
  <path d="M282 416V446" class="connector"/>
  <path d="M720 416V446" class="connector"/>
  <path d="M1158 446V416" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="116" y="338" width="332" height="78" rx="12" fill="#FFFFFF" stroke="#DCDCEF"/>
    <rect x="116" y="446" width="332" height="78" rx="12" fill="#FFFFFF" stroke="#DCDCEF"/>
    <rect x="554" y="338" width="332" height="78" rx="12" fill="#FFFFFF" stroke="#D5E3F0"/>
    <rect x="554" y="446" width="332" height="78" rx="12" fill="#FFFFFF" stroke="#D5E3F0"/>
    <rect x="992" y="446" width="332" height="78" rx="12" fill="#FFFFFF" stroke="#CCE3D7"/>
    <rect x="992" y="338" width="332" height="78" rx="12" fill="#E6F4EC" stroke="#BEDCCB"/>
  </g>
  <text x="282" y="384" class="label">New drawing</text>
  <text x="282" y="479" class="label"><tspan x="282">Reserve identity</tspan><tspan x="282" dy="24">and name</tspan></text>
  <text x="720" y="384" class="label">Write empty drawing</text>
  <text x="720" y="492" class="label">Reopen and verify</text>
  <text x="1158" y="492" class="label">Add to library</text>
  <text x="1158" y="384" class="label">Open drawing</text>

  <!-- Uncertain outcomes remain visibly separate from the success path. -->
  <path d="M720 524V647" fill="none" stroke="#A57832" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#amberArrow)"/>
  <rect x="638" y="594" width="164" height="28" rx="14" fill="#FFFFFF"/>
  <text x="720" y="613" font-size="13" font-weight="550" text-anchor="middle" fill="#956C2D">Uncertain outcome</text>
  <rect x="526" y="647" width="388" height="101" rx="14" fill="#FFFAEF" stroke="#EAD9B4"/>
  <circle cx="558" cy="679" r="10" fill="none" stroke="#A57832" stroke-width="1.5"/>
  <path d="M558 674v6m0 4v.1" stroke="#A57832" stroke-width="1.8" stroke-linecap="round"/>
  <text x="579" y="685" font-size="17" font-weight="600" fill="#785520">Keep existing bytes</text>
  <text x="579" y="716" font-size="15" fill="#937449">Reconcile before retry</text>

  <path d="M88 786H1352" stroke="#EBEEF2"/>
  <text x="88" y="815" class="caption">Design comparison · Same states and transitions as the Mermaid example</text>
  <text x="1352" y="815" class="caption" text-anchor="end">Illustration only · Storage not implemented</text>
</svg>
