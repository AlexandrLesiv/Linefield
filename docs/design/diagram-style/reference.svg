<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title description">
  <title id="title">Linefield diagram language — visual proposal v2</title>
  <desc id="description">Illustrative architectural notation, not implemented topology. The top example separates presentation, command authority and storage roles. A sequence below distinguishes an attempted commit from a proven reply. A state graph branches from Pending to Confirmed or Unknown. Unknown outcomes preserve bytes and reconcile before retry. Adoption badges are separate from runtime state and grouping colors.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#718096" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#785520" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#233148}
      .title{font-size:40px;font-weight:600;letter-spacing:-1px}
      .section{font-size:26px;font-weight:600;letter-spacing:-.4px}
      .node{font-size:20px;font-weight:600;letter-spacing:-.2px}
      .body{font-size:16px}
      .meta{font-size:14px;fill:#59677C}
      .label{font-size:14px;font-weight:600;letter-spacing:.7px;fill:#59677C}
      .badge{font-size:14px;font-weight:600}
      .panel{fill:#FFFFFF;stroke:#E1E6ED}
      .card{fill:#FFFFFF;stroke:#718096;stroke-width:1.5}
      .edge{fill:none;stroke:#718096;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .caution{fill:none;stroke:#785520;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#amber)}
      .guide{fill:none;stroke:#718096;stroke-width:1.5;stroke-dasharray:4 8}
      .icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="1160" fill="#F7F8FA"/>
  <path d="M72 69h20m-20 8h13m-13 8h20" stroke="#59547D" stroke-width="2.5" stroke-linecap="round"/>
  <text x="108" y="83" class="label">LINEFIELD / DIAGRAM LANGUAGE</text>
  <rect x="1176" y="56" width="192" height="36" rx="18" fill="#FFFFFF" stroke="#E1E6ED"/>
  <path d="M1198 67l7 7-7 7-7-7Z" fill="none" stroke="#59677C" stroke-width="1.5"/>
  <text x="1218" y="79" class="badge" style="fill:#59677C">PROPOSED · v2</text>
  <text x="72" y="142" class="title">A calmer way to see the system.</text>
  <text x="72" y="177" class="body" style="fill:#59677C">Clear ownership. Deliberate connections. A visible place for uncertainty.</text>

  <!-- One panoramic ownership view establishes the visual hierarchy. -->
  <rect x="72" y="208" width="1296" height="288" rx="24" class="panel"/>
  <text x="104" y="248" class="label">01 · OWNERSHIP</text>
  <text x="104" y="285" class="section">Who owns what</text>
  <text x="1336" y="282" class="meta" text-anchor="end">Illustrative roles · not an adopted worker topology</text>
  <rect x="104" y="312" width="328" height="152" rx="16" fill="#F7F7FE" stroke="#718096" stroke-width="1.5"/>
  <rect x="128" y="336" width="36" height="36" rx="10" fill="#EAE8F4"/>
  <g class="icon" style="color:#59547D"><rect x="137" y="345" width="18" height="14" rx="3"/><path d="M141 363h10m-5-4v4"/></g>
  <text x="176" y="360" class="label" style="fill:#59547D">PRESENTATION</text>
  <text x="128" y="404" class="node">View and user intent</text>
  <text x="128" y="436" class="body" style="fill:#59677C">Disposable interface state</text>
  <path d="M432 388H548" class="edge"/>
  <text x="490" y="350" class="meta" text-anchor="middle"><tspan x="490">Copied</tspan><tspan x="490" dy="20">request</tspan></text>
  <text x="490" y="416" class="meta" text-anchor="middle">async</text>
  <rect x="548" y="312" width="344" height="152" rx="16" fill="#F5F9FD" stroke="#718096" stroke-width="1.5"/>
  <rect x="572" y="336" width="36" height="36" rx="10" fill="#E4EDF6"/>
  <g class="icon" style="color:#466B8E"><rect x="581" y="345" width="18" height="18" rx="4"/><path d="M585 350h10m-10 4h7m-7 4h10"/></g>
  <text x="620" y="360" class="label" style="fill:#466B8E">COMMAND AUTHORITY</text>
  <text x="572" y="404" class="node">One mutable owner</text>
  <text x="572" y="436" class="body" style="fill:#59677C">Validate before accepting change</text>
  <path d="M892 388H1008" class="edge"/>
  <text x="950" y="350" class="meta" text-anchor="middle"><tspan x="950">Validated</tspan><tspan x="950" dy="20">request</tspan></text>
  <text x="950" y="416" class="meta" text-anchor="middle">async</text>
  <rect x="1008" y="312" width="328" height="152" rx="16" fill="#F3FAF7" stroke="#718096" stroke-width="1.5"/>
  <rect x="1032" y="336" width="36" height="36" rx="10" fill="#E2F0E8"/>
  <g class="icon" style="color:#386B57"><path d="M1041 347h18v16h-18Zm0 5h18m-13 6h3m5 0h1"/></g>
  <text x="1080" y="360" class="label" style="fill:#386B57">STORAGE ROLE</text>
  <text x="1032" y="404" class="node">Durable store</text>
  <text x="1032" y="436" class="body" style="fill:#59677C">Commit proof, not an assumption</text>

  <!-- Two complementary views share a baseline rather than stacking into a long poster. -->
  <rect x="72" y="528" width="792" height="448" rx="24" class="panel"/>
  <text x="104" y="568" class="label">02 · SEQUENCE</text>
  <text x="104" y="605" class="section">Attempt first. Confirm with proof.</text>
  <rect x="104" y="632" width="168" height="48" rx="12" class="card"/>
  <rect x="384" y="632" width="168" height="48" rx="12" class="card"/>
  <rect x="664" y="632" width="168" height="48" rx="12" class="card"/>
  <text x="188" y="662" class="body" text-anchor="middle">View</text>
  <text x="468" y="662" class="body" text-anchor="middle">Command owner</text>
  <text x="748" y="662" class="body" text-anchor="middle">Durable store</text>
  <path d="M188 680V888M468 680V888M748 680V848" class="guide"/>
  <path d="M188 728H468" class="edge"/>
  <text x="328" y="713" class="meta" text-anchor="middle">1 · Request change · async</text>
  <path d="M468 780H748" class="edge"/>
  <text x="608" y="765" class="meta" text-anchor="middle">2 · Commit attempt · async</text>
  <path d="M748 832H468" class="edge"/>
  <text x="608" y="817" class="meta" text-anchor="middle">3 · Reply · only with proof</text>
  <path d="M468 884H188" class="edge"/>
  <text x="328" y="869" class="meta" text-anchor="middle">4 · Confirmed reply · if proven</text>
  <rect x="104" y="912" width="728" height="40" rx="12" fill="#FFFAEF"/>
  <circle cx="124" cy="932" r="8" fill="none" stroke="#785520" stroke-width="1.5"/>
  <path d="M124 928v4m0 4v.1" stroke="#785520" stroke-width="1.8" stroke-linecap="round"/>
  <text x="144" y="938" class="body" style="fill:#785520">Unknown? Preserve bytes; reconcile before retry.</text>

  <rect x="896" y="528" width="472" height="448" rx="24" class="panel"/>
  <text x="928" y="568" class="label">03 · OUTCOMES</text>
  <text x="928" y="605" class="section">Make uncertainty visible.</text>
  <rect x="1024" y="648" width="216" height="56" rx="14" class="card"/>
  <text x="1132" y="683" class="node" text-anchor="middle">Pending</text>
  <path d="M1132 704V752H1016V816" class="edge"/>
  <path d="M1132 704V752H1248V816" class="caution"/>
  <rect x="936" y="766" width="160" height="28" rx="14" fill="#FFFFFF"/>
  <text x="1016" y="785" class="meta" text-anchor="middle">Proof received</text>
  <rect x="1168" y="766" width="160" height="28" rx="14" fill="#FFFFFF"/>
  <text x="1248" y="785" class="meta" text-anchor="middle" style="fill:#785520">Lost reply</text>
  <rect x="920" y="816" width="192" height="56" rx="14" class="card"/>
  <text x="1016" y="851" class="node" text-anchor="middle">Confirmed</text>
  <rect x="1152" y="816" width="192" height="56" rx="14" fill="#FFFAEF" stroke="#785520" stroke-width="1.5"/>
  <text x="1248" y="851" class="node" text-anchor="middle" style="fill:#785520">Unknown</text>
  <text x="928" y="922" class="body" style="fill:#59677C">States describe behavior.</text>
  <text x="928" y="948" class="meta">Approval lives in the separate badges below.</text>

  <!-- A quiet legend preserves semantic precision without dominating the composition. -->
  <text x="72" y="1018" class="label">EVIDENCE STATUS</text>
  <text x="1368" y="1018" class="meta" text-anchor="end">Solid arrows: messages · Dashed guides: participant lifetime</text>
  <circle cx="80" cy="1055" r="5" fill="#386B57"/>
  <text x="96" y="1060" class="badge" style="fill:#386B57">Current</text>
  <path d="m240 1055 5 5 10-11" fill="none" stroke="#466B8E" stroke-width="2"/>
  <text x="269" y="1060" class="badge" style="fill:#466B8E">Approved · not built</text>
  <path d="m536 1048 7 7-7 7-7-7Z" fill="none" stroke="#59677C" stroke-width="1.5"/>
  <text x="558" y="1060" class="badge" style="fill:#59677C">Proposed</text>
  <rect x="728" y="1048" width="14" height="14" rx="2" fill="none" stroke="#9C3B32" stroke-width="1.5"/>
  <path d="m731 1051 8 8m0-8-8 8" stroke="#9C3B32" stroke-width="1.5"/>
  <text x="756" y="1060" class="badge" style="fill:#9C3B32">Blocked</text>
  <path d="M922 1055h14" stroke="#59677C" stroke-width="2"/>
  <text x="950" y="1060" class="badge" style="fill:#59677C">Historical</text>
  <path d="M72 1090H1368" stroke="#E1E6ED"/>
  <text x="72" y="1120" class="meta">Visual proposal v2 · Examples do not approve architecture or claim implementation.</text>
  <text x="1368" y="1120" class="meta" text-anchor="end">2026-10-19 · View SVG at full size</text>
</svg>
