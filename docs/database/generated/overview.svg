<title id="title">Library schema boundaries</title>
<desc id="description">Generated schema review. SQL owns reference structure; Rust owns semantic validation and cross-file coordination. The companion dictionary includes every source note, constraint, index and relationship. No production implementation is approved by this image.</desc>
