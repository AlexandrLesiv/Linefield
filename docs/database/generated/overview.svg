<text x="72" y="900" class="section">Three separate files · shared identity is a logical link, never a cross-file SQL FK</text>
<text x="72" y="944" class="body">Drawing: portable metadata and artwork authority. Catalog: repairable projection and local lifecycle authority.</text>
<text x="72" y="980" class="body">Jobs: immutable source capture and destination grants. File updates do not form one atomic transaction.</text>
<text x="72" y="1030" class="body">17 tables · 146 columns · 11 same-file relationships. Failure preserves uncertain sources; no destructive guessing.</text>
<text x="72" y="1100" class="meta">Generated from shared/schema inputs · full notes and SQL details: dictionary.md · no cross-file SQL foreign keys</text>
